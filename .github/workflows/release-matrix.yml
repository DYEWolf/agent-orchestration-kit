name: Release Matrix

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          - os: ubuntu-latest
            node: '26'
          - os: macos-latest
            node: '22'
          - os: macos-latest
            node: '24'
          - os: macos-latest
            node: '26'
          - os: windows-latest
            node: '22'
          - os: windows-latest
            node: '24'
          - os: windows-latest
            node: '26'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee release-matrix-output.log
      - name: Run check
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee -a release-matrix-output.log
      - name: Upload check diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-matrix-${{ matrix.os }}-node-${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-matrix-output.log
          if-no-files-found: error
          retention-days: 14
